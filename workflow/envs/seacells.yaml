name: seacells
# using the second method described in https://github.com/dpeerlab/SEACells/tree/main because the first one resulted in import errors
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - cython
  - python=3.8
  - pip
  - pip:
    - git+https://github.com/settylab/Palantir@removeTSNE
    - git+https://github.com/dpeerlab/SEACells.git # not tested yet, might need to do it manually as described in the previous link
    - papermill