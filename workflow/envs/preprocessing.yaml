name: preprocessing
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::jupyterlab=3.5.0
  - conda-forge::leidenalg=0.9.1
  - conda-forge::numba=0.56.4
  - conda-forge::python=3.9.15
  - conda-forge::r-base=4.1.3
  - conda-forge::r-soupx=1.6.1
  - conda-forge::r-sctransform=0.3.3
  - conda-forge::r-glmpca=0.2.0
  - conda-forge::rpy2=3.5.11
  - conda-forge::scanpy=1.9.3
  - conda-forge::session-info=1.0.0
  - bioconda::anndata2ri=1.1
  - bioconda::bioconductor-scdblfinder=1.8.0
  - bioconda::bioconductor-scry=1.6.0
  - bioconda::bioconductor-scran=1.22.1
  - bioconda::bioconductor-glmgampoi=1.6.0
  - conda-forge::papermill # for the pipeline only
  - bioconductor-genomeinfodbdata=1.2.7
  - celltypist
  - openssl<=3.5.0
  - numpy<=2.0 # fixes ValueError: numpy.dtype size changed, may indicate binary incompatibility. Expected 96 from C header, got 88 from PyObject
  - pip
  - pip:
      # - mygene # not needed anymore
      # - sc3s # does not work with downstream plots and analysis in scanpy
      - gprofiler-official
      # - git+https://github.com/csgroen/scycle.git#egg=scycle # pkg internal key error
      - cnmf
